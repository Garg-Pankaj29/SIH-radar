name: Refresh SIH Data

on:
  schedule:
    - cron: '0 * * * *' # Every 1 hour
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run data fetcher
        run: |
          python -m backend.api_data

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ frontend/data/ frontend/public/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-refresh SIH data from sih.gov.in" && git push)
